name: Reusable Semantic Diff

on:
  workflow_call:
    inputs:
      difftastic-version:
        description: 'Version of difftastic to install (e.g., 0.66.0). Leave empty to use latest.'
        required: false
        type: string
        default: ''
      file-patterns:
        description: 'File patterns to include in diff (space-separated). Leave empty for all files.'
        required: false
        type: string
        default: ''
      exclude-patterns:
        description: 'File patterns to exclude from diff (space-separated).'
        required: false
        type: string
        default: ''

permissions:
  pull-requests: write
  contents: read

jobs:
  semantic-diff:
    runs-on: ubuntu-latest
    # Ensure only one workflow runs per PR at a time to avoid race conditions
    concurrency:
      group: semantic-diff-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base commit
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Download difftastic binary
        run: |
          # Determine version to download
          if [ -n "${{ inputs.difftastic-version }}" ]; then
            VERSION="${{ inputs.difftastic-version }}"
          else
            echo "Fetching latest version..."
            VERSION=$(curl -s https://api.github.com/repos/Wilfred/difftastic/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          fi

          echo "Downloading difftastic version $VERSION..."

          # Download prebuilt binary for Linux x86_64
          DOWNLOAD_URL="https://github.com/Wilfred/difftastic/releases/download/${VERSION}/difft-x86_64-unknown-linux-gnu.tar.gz"

          curl -L -o difft.tar.gz "$DOWNLOAD_URL"
          tar -xzf difft.tar.gz
          chmod +x difft

          # Move to a location in PATH
          sudo mv difft /usr/local/bin/

          echo "Difftastic version $VERSION installed successfully"
          difft --version

      - name: Install image generation tools
        run: |
          # Install ImageMagick for image manipulation
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu-core

          # Install ansi2html for better terminal rendering
          pip install ansi2html

      - name: Get list of changed files
        id: changed-files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Get list of changed files that can be diffed
          # For M (modified): compare old vs new
          # For A (added): compare empty vs new (show what was added)
          # For R (renamed): compare old name vs new name
          # For C (copied): compare source vs copy
          # Skip D (deleted) - no head counterpart to diff

          > all_changed_files.txt

          git diff --name-status "$BASE_SHA" "$HEAD_SHA" | while IFS=$'\t' read -r status file1 file2; do
            case "$status" in
              M*)
                # Modified: file1 is the filename
                echo "M:$file1" >> all_changed_files.txt
                ;;
              A*)
                # Added: file1 is the new filename
                # We'll diff empty vs new file content
                echo "A:$file1" >> all_changed_files.txt
                ;;
              R*)
                # Renamed: file1 is old name, file2 is new name
                # We'll diff the old name in base against new name in head
                echo "R:$file1:$file2" >> all_changed_files.txt
                ;;
              C*)
                # Copied: file1 is source, file2 is copy
                echo "C:$file1:$file2" >> all_changed_files.txt
                ;;
            esac
          done

          # Apply file patterns if specified
          if [ -n "${{ inputs.file-patterns }}" ]; then
            echo "Filtering files with patterns: ${{ inputs.file-patterns }}"
            # Combine patterns with OR for single grep pass
            PATTERN="${{ inputs.file-patterns }}"
            COMBINED_PATTERN=$(echo "$PATTERN" | sed 's/ /|/g')
            grep -E "$COMBINED_PATTERN" all_changed_files.txt > changed_files.txt || touch changed_files.txt
          else
            cp all_changed_files.txt changed_files.txt
          fi

          # Apply exclude patterns if specified
          if [ -n "${{ inputs.exclude-patterns }}" ]; then
            echo "Excluding files with patterns: ${{ inputs.exclude-patterns }}"
            # Combine exclude patterns with OR for single grep pass
            EXCLUDE_PATTERN="${{ inputs.exclude-patterns }}"
            COMBINED_EXCLUDE=$(echo "$EXCLUDE_PATTERN" | sed 's/ /|/g')
            grep -vE "$COMBINED_EXCLUDE" changed_files.txt > temp_files.txt || touch temp_files.txt
            mv temp_files.txt changed_files.txt
          fi

          echo "Changed files to process:"
          cat changed_files.txt

          # Count changed files
          FILE_COUNT=$(wc -l < changed_files.txt | tr -d ' ')
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT

      - name: Generate semantic diffs
        id: generate-diffs
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          mkdir -p diff_output

          # Create markdown output file
          MARKDOWN_FILE="diff_output/diff_summary.md"
          echo "# Semantic Diff Summary" > "$MARKDOWN_FILE"
          echo "" >> "$MARKDOWN_FILE"
          echo "Comparing \`$BASE_SHA\` → \`$HEAD_SHA\`" >> "$MARKDOWN_FILE"
          echo "" >> "$MARKDOWN_FILE"

          # Create HTML output file
          HTML_FILE="diff_output/diff_viewer.html"
          cat > "$HTML_FILE" << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Semantic Diff Viewer</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      background: #0d1117;
                      color: #c9d1d9;
                      padding: 20px;
                      line-height: 1.6;
                  }
                  .container {
                      max-width: 1400px;
                      margin: 0 auto;
                  }
                  h1 {
                      color: #58a6ff;
                      margin-bottom: 30px;
                      padding-bottom: 10px;
                      border-bottom: 1px solid #21262d;
                  }
                  .info {
                      background: #161b22;
                      padding: 15px;
                      border-radius: 6px;
                      margin-bottom: 30px;
                      border: 1px solid #21262d;
                  }
                  .file-diff {
                      background: #161b22;
                      border: 1px solid #21262d;
                      border-radius: 6px;
                      margin-bottom: 20px;
                      overflow: hidden;
                  }
                  .file-header {
                      background: #21262d;
                      padding: 12px 16px;
                      font-weight: 600;
                      font-family: 'Consolas', 'Monaco', monospace;
                      font-size: 14px;
                      cursor: pointer;
                      user-select: none;
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                  }
                  .file-header:hover {
                      background: #2d333b;
                  }
                  .file-header .toggle {
                      color: #8b949e;
                      font-size: 12px;
                  }
                  .file-content {
                      padding: 16px;
                      display: none;
                  }
                  .file-content.expanded {
                      display: block;
                  }
                  pre {
                      background: #0d1117;
                      padding: 16px;
                      border-radius: 6px;
                      overflow-x: auto;
                      font-family: 'Consolas', 'Monaco', monospace;
                      font-size: 13px;
                      line-height: 1.5;
                      white-space: pre-wrap;
                      word-wrap: break-word;
                  }
                  .no-changes {
                      color: #8b949e;
                      font-style: italic;
                      padding: 20px;
                      text-align: center;
                  }
                  .button-group {
                      margin-bottom: 20px;
                  }
                  .expand-all {
                      background: #238636;
                      color: white;
                      border: none;
                      padding: 8px 16px;
                      border-radius: 6px;
                      cursor: pointer;
                      font-size: 14px;
                  }
                  .expand-all:hover {
                      background: #2ea043;
                  }
                  .collapse-all {
                      background: #da3633;
                      color: white;
                      border: none;
                      padding: 8px 16px;
                      border-radius: 6px;
                      cursor: pointer;
                      margin-left: 10px;
                      font-size: 14px;
                  }
                  .collapse-all:hover {
                      background: #f85149;
                  }
                  .stats {
                      background: #161b22;
                      padding: 10px 15px;
                      border-radius: 6px;
                      margin-bottom: 20px;
                      border: 1px solid #21262d;
                      font-size: 14px;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🔍 Semantic Diff Viewer</h1>
                  <div class="info">
                      <p><strong>Repository:</strong> ${{ github.repository }}</p>
                      <p><strong>Pull Request:</strong> #${{ github.event.pull_request.number }}</p>
                      <p><strong>Base:</strong> <code>${{ github.event.pull_request.base.sha }}</code></p>
                      <p><strong>Head:</strong> <code>${{ github.event.pull_request.head.sha }}</code></p>
                  </div>
                  <div class="button-group">
                      <button class="expand-all" onclick="expandAll()">Expand All</button>
                      <button class="collapse-all" onclick="collapseAll()">Collapse All</button>
                  </div>
                  <div class="stats" id="stats"></div>
                  <div id="diffs">
          HTMLEOF

          # Process each changed file
          HAS_DIFFS=false
          DIFF_COUNT=0
          mkdir -p diff_output/images

          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi

            # Parse the status and file paths
            STATUS="${file%%:*}"
            REST="${file#*:}"

            case "$STATUS" in
              M)
                # Modified file
                BASE_FILE_PATH="$REST"
                HEAD_FILE_PATH="$REST"
                DISPLAY_NAME="$REST"
                ;;
              A)
                # Added file - compare against empty
                BASE_FILE_PATH=""
                HEAD_FILE_PATH="$REST"
                DISPLAY_NAME="$REST (new file)"
                ;;
              R)
                # Renamed file
                BASE_FILE_PATH="${REST%:*}"
                HEAD_FILE_PATH="${REST#*:}"
                DISPLAY_NAME="$HEAD_FILE_PATH (renamed from $BASE_FILE_PATH)"
                ;;
              C)
                # Copied file
                BASE_FILE_PATH="${REST%:*}"
                HEAD_FILE_PATH="${REST#*:}"
                DISPLAY_NAME="$HEAD_FILE_PATH (copied from $BASE_FILE_PATH)"
                ;;
            esac

            echo "Processing: $DISPLAY_NAME"

            # Get file contents from both commits
            if [ -z "$BASE_FILE_PATH" ]; then
              # New file - use empty base
              BASE_FILE=""
            else
              BASE_FILE=$(git show "$BASE_SHA:$BASE_FILE_PATH" 2>/dev/null)
            fi
            HEAD_FILE=$(git show "$HEAD_SHA:$HEAD_FILE_PATH" 2>/dev/null)

            # Create temp files for diff
            BASE_TEMP=$(mktemp)
            HEAD_TEMP=$(mktemp)

            echo "$BASE_FILE" > "$BASE_TEMP"
            echo "$HEAD_FILE" > "$HEAD_TEMP"

            # Run difftastic once with color
            DIFF_OUTPUT=$(difft --color=always --display=side-by-side "$BASE_TEMP" "$HEAD_TEMP" 2>&1 || true)

            rm "$BASE_TEMP" "$HEAD_TEMP"

            # Check if there are actual changes (difftastic outputs something even for identical files)
            if [ -n "$DIFF_OUTPUT" ] && ! echo "$DIFF_OUTPUT" | grep -q "^No changes"; then
              HAS_DIFFS=true
              DIFF_COUNT=$((DIFF_COUNT + 1))

              # Strip ANSI color codes for plain text version
              DIFF_OUTPUT_NO_COLOR=$(echo "$DIFF_OUTPUT" | sed 's/\x1B\[[0-9;]*[JKmsu]//g')

              # Escape for HTML
              ESCAPED_DIFF=$(echo "$DIFF_OUTPUT" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

              # Generate image for this diff
              SAFE_FILENAME=$(echo "$file" | sed 's/[\/\.]/_/g')
              IMAGE_FILE="diff_output/images/${SAFE_FILENAME}.png"

              # Convert ANSI colored output to HTML, then to image
              echo "$DIFF_OUTPUT" | ansi2html --inline > "diff_output/images/${SAFE_FILENAME}.html"

              # Use wkhtmltoimage or convert HTML to image with headless browser
              # For simplicity, we'll store the HTML and convert them all at the end
              echo "$IMAGE_FILE" >> diff_output/image_list.txt

              # Add to HTML
              cat >> "$HTML_FILE" << HTMLPART
                      <div class="file-diff">
                          <div class="file-header" onclick="toggleDiff(this)">
                              <span>$DISPLAY_NAME</span>
                              <span class="toggle">▶ Click to expand</span>
                          </div>
                          <div class="file-content">
                              <pre>$ESCAPED_DIFF</pre>
                          </div>
                      </div>
          HTMLPART

              # Add to markdown (collapsed by default)
              echo "<details>" >> "$MARKDOWN_FILE"
              echo "<summary><code>$DISPLAY_NAME</code></summary>" >> "$MARKDOWN_FILE"
              echo "" >> "$MARKDOWN_FILE"
              echo '```' >> "$MARKDOWN_FILE"
              echo "$DIFF_OUTPUT_NO_COLOR" >> "$MARKDOWN_FILE"
              echo '```' >> "$MARKDOWN_FILE"
              echo "" >> "$MARKDOWN_FILE"
              echo "</details>" >> "$MARKDOWN_FILE"
              echo "" >> "$MARKDOWN_FILE"
            else
              echo "  → No changes detected"
            fi
          done < changed_files.txt

          if [ "$HAS_DIFFS" = false ]; then
            echo "<div class='no-changes'>No semantic changes detected in modified files.</div>" >> "$HTML_FILE"
            echo "" >> "$MARKDOWN_FILE"
            echo "_No semantic changes detected in modified files._" >> "$MARKDOWN_FILE"
          fi

          # Complete HTML file
          cat >> "$HTML_FILE" << HTMLEOF
                  </div>
              </div>
              <script>
                  const diffCount = $DIFF_COUNT;
                  document.getElementById('stats').innerHTML = '<strong>Files with changes:</strong> ' + diffCount;

                  function toggleDiff(header) {
                      const content = header.nextElementSibling;
                      const toggle = header.querySelector('.toggle');
                      if (content.classList.contains('expanded')) {
                          content.classList.remove('expanded');
                          toggle.textContent = '▶ Click to expand';
                      } else {
                          content.classList.add('expanded');
                          toggle.textContent = '▼ Click to collapse';
                      }
                  }

                  function expandAll() {
                      document.querySelectorAll('.file-content').forEach(content => {
                          content.classList.add('expanded');
                      });
                      document.querySelectorAll('.toggle').forEach(toggle => {
                          toggle.textContent = '▼ Click to collapse';
                      });
                  }

                  function collapseAll() {
                      document.querySelectorAll('.file-content').forEach(content => {
                          content.classList.remove('expanded');
                      });
                      document.querySelectorAll('.toggle').forEach(toggle => {
                          toggle.textContent = '▶ Click to expand';
                      });
                  }
              </script>
          </body>
          </html>
          HTMLEOF

          echo "Diff generation complete! Generated diffs for $DIFF_COUNT files."

      - name: Upload HTML diff viewer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semantic-diff-viewer-pr-${{ github.event.pull_request.number }}
          path: diff_output/diff_viewer.html
          retention-days: 30

      - name: Generate initial PR comment body (without image)
        run: |
          cat > diff_output/pr_comment.md << 'COMMENTEOF'
          ## 🔍 Semantic Diff Summary

          <details>
          <summary>📊 View Semantic Diffs (Click to expand)</summary>

          COMMENTEOF

          # Append the diff summary content (skip first 3 lines which are headers)
          tail -n +4 diff_output/diff_summary.md >> diff_output/pr_comment.md

          cat >> diff_output/pr_comment.md << 'COMMENTEOF'

          </details>

          <details>
          <summary>🖼️ View Diff as Image (Click to expand)</summary>

          _⏳ Generating image... This will be updated shortly._

          </details>

          ---

          ### 📄 Interactive HTML Viewer

          **[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**

          To view the full interactive HTML diff viewer:
          1. Click the link above to go to the workflow run
          2. Scroll down to "Artifacts"
          3. Download \`semantic-diff-viewer-pr-${{ github.event.pull_request.number }}\`
          4. Extract and open \`diff_viewer.html\` in your browser

          <sub>Generated by [difftastic](https://github.com/Wilfred/difftastic) • Last updated: \`${{ github.event.pull_request.head.sha }}\`</sub>
          COMMENTEOF

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Semantic Diff Summary'

      - name: Post initial PR comment with text diffs
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: diff_output/pr_comment.md

      - name: Install playwright for HTML to image conversion
        if: hashFiles('diff_output/image_list.txt') != ''
        run: |
          npm install -g playwright
          playwright install chromium

      - name: Convert diff HTML to images
        if: hashFiles('diff_output/image_list.txt') != ''
        run: |
          # Create a Node.js script to convert HTML to images
          cat > convert_to_images.js << 'JSEOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();

            // Get all HTML files in images directory
            const imagesDir = 'diff_output/images';
            const files = fs.readdirSync(imagesDir).filter(f => f.endsWith('.html'));

            for (const file of files) {
              const htmlPath = path.join(imagesDir, file);
              const pngPath = htmlPath.replace('.html', '.png');

              await page.goto(`file://${process.cwd()}/${htmlPath}`);
              await page.screenshot({
                path: pngPath,
                fullPage: true,
                type: 'png'
              });

              console.log(`Generated ${pngPath}`);
            }

            // Create a combined image with all diffs
            const combinedHtml = `
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body {
                  font-family: monospace;
                  background: #0d1117;
                  color: #c9d1d9;
                  padding: 20px;
                  margin: 0;
                }
                .file-section {
                  margin-bottom: 40px;
                  border: 1px solid #30363d;
                  border-radius: 6px;
                  overflow: hidden;
                }
                .file-header {
                  background: #161b22;
                  padding: 10px 15px;
                  font-weight: bold;
                  border-bottom: 1px solid #30363d;
                }
                .file-content {
                  padding: 15px;
                }
              </style>
            </head>
            <body>
              <h1>Semantic Diff - All Files</h1>
              ${files.map(file => {
                const content = fs.readFileSync(path.join(imagesDir, file), 'utf8');
                const filename = file.replace('.html', '').replace(/_/g, '/');
                return `
                  <div class="file-section">
                    <div class="file-header">${filename}</div>
                    <div class="file-content">${content}</div>
                  </div>
                `;
              }).join('\n')}
            </body>
            </html>
            `;

            fs.writeFileSync('diff_output/images/combined.html', combinedHtml);
            await page.goto(`file://${process.cwd()}/diff_output/images/combined.html`);
            await page.screenshot({
              path: 'diff_output/images/combined_diff.png',
              fullPage: true,
              type: 'png'
            });

            await browser.close();
            console.log('All images generated successfully!');
          })();
          JSEOF

          node convert_to_images.js

      - name: Upload diff images as artifact
        if: hashFiles('diff_output/image_list.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semantic-diff-images-pr-${{ github.event.pull_request.number }}
          path: diff_output/images/
          retention-days: 30

      - name: Upload combined diff image to GitHub
        if: hashFiles('diff_output/images/combined_diff.png') != ''
        id: upload-image
        run: |
          # Upload image as a comment attachment using GitHub API
          IMAGE_URL=$(curl -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @diff_output/images/combined_diff.png \
            "https://uploads.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/assets?name=combined_diff.png" | jq -r '.url')

          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "Uploaded image: $IMAGE_URL"

      - name: Generate final PR comment body with image
        if: hashFiles('diff_output/images/combined_diff.png') != ''
        run: |
          cat > diff_output/pr_comment_final.md << 'COMMENTEOF'
          ## 🔍 Semantic Diff Summary

          <details>
          <summary>📊 View Semantic Diffs (Click to expand)</summary>

          COMMENTEOF

          # Append the diff summary content (skip first 3 lines which are headers)
          tail -n +4 diff_output/diff_summary.md >> diff_output/pr_comment_final.md

          cat >> diff_output/pr_comment_final.md << 'COMMENTEOF'

          </details>

          <details>
          <summary>🖼️ View Diff as Image (Click to expand)</summary>

          ![Semantic Diff](${{ steps.upload-image.outputs.image_url }})

          </details>

          ---

          ### 📄 Interactive HTML Viewer

          **[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**

          To view the full interactive HTML diff viewer:
          1. Click the link above to go to the workflow run
          2. Scroll down to "Artifacts"
          3. Download \`semantic-diff-viewer-pr-${{ github.event.pull_request.number }}\`
          4. Extract and open \`diff_viewer.html\` in your browser

          <sub>Generated by [difftastic](https://github.com/Wilfred/difftastic) • Last updated: \`${{ github.event.pull_request.head.sha }}\`</sub>
          COMMENTEOF

      - name: Update PR comment with image
        if: hashFiles('diff_output/images/combined_diff.png') != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: diff_output/pr_comment_final.md
